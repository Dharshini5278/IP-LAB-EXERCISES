<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Ticket Reservation</title></head>
<body style="font-family:sans-serif;background:#f0f2f5;padding:20px;">
<div style="max-width:500px;background:white;padding:30px;margin:auto;border-radius:10px;">
<h2>🚆 Train Ticket Reservation</h2>
<form action="confirmation.html" method="GET">
<label>Passenger Name:</label><br><input type="text" name="name" required style="width:100%;padding:8px;margin:10px 0;"><br>
<label>Source:</label><br><select name="source" style="width:100%;padding:8px;margin:10px 0;"><option>Chennai</option><option>Madurai</option></select><br>
<label>Destination:</label><br><select name="destination" style="width:100%;padding:8px;margin:10px 0;"><option>Madurai</option><option>Chennai</option></select><br>
<button type="submit" style="background:#1a73e8;color:white;border:none;padding:10px;width:100%;border-radius:5px;cursor:pointer;">Book Ticket</button>
</form></div></body>
</html>
