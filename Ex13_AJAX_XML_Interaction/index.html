<!DOCTYPE html><html><body><button onclick="fetchData()">Load AJAX</button><div id="res"></div><script>function fetchData(){let x=new XMLHttpRequest();x.onreadystatechange=function(){if(this.readyState==4)document.getElementById('res').innerText=this.responseText;};x.open('GET','data.xml',true);x.send();}<\/script></body></html>
